server.port=${PORT:8080}

# ---- MySQL (default) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ---- JWT ----
jwt.secret=${JWT_SECRET:LOVZBjGfrqe4awqcRYFSslLF5ubyLLbsT9UIRercuo4w4hLyGEp+BYw/Uea7i6y+}
jwt.expiration-ms=86400000

# ---- Matching engine ----
bloodconnect.matching.radius-km=25
bloodconnect.matching.max-donors=10
bloodconnect.matching.min-gap-days=90

# ---- Misc ----
bloodconnect.seed-demo=${SEED_DEMO:true}
bloodconnect.admin.email=${ADMIN_EMAIL:admin@bloodconnect.com}
bloodconnect.admin.password=${ADMIN_PASSWORD:admin123}
bloodconnect.cors.allowed-origins=http://localhost:5173,http://localhost:3000
